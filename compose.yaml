services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: PI6Backend
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app
          initial_sync: true
        - action: rebuild
          path: uv.lock
    ports:
      - ${BACKEND_PORT}:8000
    env_file: .env
    depends_on:
      - pi6-db
    networks:
      - frontend-network
      - backend-network

  pi6-db:
    image: postgres:16.4
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pi6-db:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    networks:
      - backend-network

volumes:
  pi6-db:
    name: "pi6-db"

networks:
  frontend-network: {}
  backend-network: {}

